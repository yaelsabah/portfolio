<!doctype html>
<!-- TEMPORARY: a page for checking the site at desktop and phone sizes. Delete this file before going live. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Preview: desktop and mobile</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=GFS+Didot&display=swap">
  <link rel="stylesheet" href="styles/tokens.css?v=20261111">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column;
      background: #E4E0DA;
      font-family: var(--font-body);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* toolbar */
    .bar {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
      gap: 12px; padding: 10px 16px;
      background: var(--ground);
      border-bottom: 1px solid var(--line);
    }
    .bar-label { font-size: 14px; color: var(--muted); }
    .bar-label strong { color: var(--ink); font-weight: 600; }
    .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

    select {
      height: 36px; padding: 0 12px;
      font: inherit; font-size: 14px; color: var(--ink);
      background: #fff; border: 1px solid var(--line); border-radius: var(--r-pill);
    }

    /* the Desktop / Mobile switch */
    .switch {
      display: inline-flex; padding: 3px;
      background: var(--surface); border-radius: var(--r-pill);
    }
    .switch button {
      display: inline-flex; align-items: center; gap: 6px;
      height: 32px; padding: 0 14px;
      font: inherit; font-size: 14px; font-weight: 500; color: var(--muted);
      background: none; border: 0; border-radius: var(--r-pill); cursor: pointer;
      transition: background-color .2s ease, color .2s ease, box-shadow .2s ease;
    }
    .switch button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(17, 17, 17, .12); }
    .switch button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .switch svg { flex: none; }

    /* the page in its frame */
    .stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start; overflow: auto; }
    .screen { display: block; border: 0; background: var(--ground); }

    body[data-view="desktop"] .stage { padding: 0; }
    body[data-view="desktop"] .screen { width: 100%; height: 100%; }

    /* an iPhone-sized window: 390 × 844 CSS pixels */
    body[data-view="mobile"] .stage { padding: 28px 16px 40px; }
    body[data-view="mobile"] .phone {
      flex: none;
      padding: 12px;
      background: #111;
      border-radius: 54px;
      box-shadow: 0 30px 80px -30px rgba(17, 17, 17, .45);
    }
    body[data-view="mobile"] .screen { width: 390px; height: 844px; border-radius: 42px; }
    body[data-view="desktop"] .phone { display: contents; }
  </style>
</head>
<body data-view="desktop">
  <div class="bar">
    <span class="bar-label"><strong>Preview</strong> · <span id="size">desktop</span></span>
    <div class="controls">
      <select id="page" aria-label="Page">
        <option value="index.html">Home</option>
        <option value="case-study.html?project=life-tribute">Life Tribute</option>
        <option value="case-study.html?project=checklist">The Checklist</option>
        <option value="case-study.html?project=minuteful">Minuteful for Wound</option>
      </select>
      <div class="switch" role="group" aria-label="View">
        <button type="button" data-set="desktop" aria-pressed="true">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14h5M8 11.5V14"/></svg>
          Desktop
        </button>
        <button type="button" data-set="mobile" aria-pressed="false">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="4" y="1.5" width="8" height="13" rx="1.8"/><path d="M7 12.5h2"/></svg>
          Mobile
        </button>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="phone">
      <iframe class="screen" id="screen" title="Portfolio preview" src="index.html"></iframe>
    </div>
  </div>

  <script>
    (() => {
      const body = document.body;
      const frame = document.getElementById('screen');
      const pageSelect = document.getElementById('page');
      const sizeLabel = document.getElementById('size');
      const buttons = document.querySelectorAll('.switch button');

      const store = {
        get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
      };

      // the page currently shown in the frame (follows links clicked inside it)
      function currentPage() {
        try {
          const loc = frame.contentWindow.location;
          return loc.pathname.split('/').pop() + loc.search + loc.hash;
        } catch (e) { return frame.getAttribute('src'); }
      }

      function setView(view) {
        body.dataset.view = view;
        buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.set === view)));
        sizeLabel.textContent = view === 'mobile' ? 'mobile, 390 × 844' : 'desktop, full width';
        store.set('preview-view', view);
        // reload the same page so layouts that measure the screen (like the home page's project stack) start fresh
        const page = currentPage();
        frame.src = 'about:blank';
        requestAnimationFrame(() => { frame.src = page; });
      }

      buttons.forEach((b) => b.addEventListener('click', () => setView(b.dataset.set)));

      pageSelect.addEventListener('change', () => {
        frame.src = pageSelect.value;
        store.set('preview-page', pageSelect.value);
      });

      // keep the page menu in step when a link inside the frame is followed
      frame.addEventListener('load', () => {
        const page = currentPage();
        if (!page || page === 'about:blank') return;
        const match = [...pageSelect.options].find((o) => page.startsWith(o.value.split('#')[0]) && (o.value.includes('?') ? page.includes(o.value.split('?')[1]) : !page.includes('?')));
        if (match) { pageSelect.value = match.value; store.set('preview-page', match.value); }
      });

      const savedPage = store.get('preview-page');
      if (savedPage && [...pageSelect.options].some((o) => o.value === savedPage)) {
        pageSelect.value = savedPage;
        frame.src = savedPage;
      }
      const savedView = store.get('preview-view');
      if (savedView === 'mobile') setView('mobile');
    })();
  </script>
</body>
</html>
